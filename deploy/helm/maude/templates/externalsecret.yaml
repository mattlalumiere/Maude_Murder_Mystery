{{- if eq .Values.secrets.mode "externalSecrets" }}
apiVersion: {{ .Values.secrets.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "maude.fullname" . }}
  labels:
    {{- include "maude.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.secrets.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.secretName }}
    creationPolicy: Owner
  data:
    {{- range $env, $remote := .Values.secrets.externalSecrets.remoteKeys }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- end }}
