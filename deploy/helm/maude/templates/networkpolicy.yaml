{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "maude.fullname" . }}-default-deny
  labels:
    {{- include "maude.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "maude.fullname" . }}-allow
  labels:
    {{- include "maude.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "maude.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressFrom.namespaceSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
    {{- if .Values.cleanup.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cleanup
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range $name, $e := .Values.networkPolicy.egress }}
    {{- if and (ne $name "extra") $e.cidrs }}
    - to:
        {{- range $e.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ $e.port }}
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
