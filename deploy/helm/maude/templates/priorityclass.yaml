{{- if and .Values.priorityClass.create (not .Values.priorityClass.existingName) }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClass.name }}
  labels:
    {{- include "maude.labels" . | nindent 4 }}
value: {{ .Values.priorityClass.value }}
globalDefault: false
description: Murder Mystery Night web pods
{{- end }}
